<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de Média Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="Golden-retriever-svg-file-Dog-svg-Graphics-14607561-2-580x387.jpg" alt="Logo do Calculador de Média Escolar">
    
    <div class="container">
        <div class="logo">
            <h1>MÉDIAPOST ALUNOS</h1>
        </div>

        <p>Insira as notas abaixo para calcular a média:</p>

        <div class="input-group">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" step="0.1" min="0" max="10" placeholder="0.0">
        </div>

        <div class="input-group">
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" step="0.1" min="0" max="10" placeholder="0.0">
        </div>

        <div class="input-group">
            <label for="nota3">Nota 3:</label>
            <input type="number" id="nota3" step="0.1" min="0" max="10" placeholder="0.0">
        </div>

        <button id="btnCalcular">Calcular Média</button>
        
        <button id="btnReset">Tentar de novo.</button>

        <div id="resultado" class="resultado-oculto">
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
